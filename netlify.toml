# Only needed if you later connect this repository to Netlify so it builds on
# every push. For a drag-and-drop deploy of the docs/ folder, Netlify ignores
# this file — the folder is already built.

[build]
  command = "npm run build"
  publish = "docs"

[build.environment]
  NODE_VERSION = "22"

# The renders and the hero video are content-hashed by name only when Next
# emits them under _next/. Everything in media/ keeps its filename across
# builds, so it is cached for a day rather than forever — long enough to be
# fast, short enough that replacing an image actually shows up.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
